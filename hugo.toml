baseURL = 'https://kathywang.ca/'
languageCode = 'en-us'
title = 'Kathy Wang'
copyright = '© 2026 Kathy Wang. All rights reserved.'

canonifyURLs = true

[module]
  [module.hugoVersion]
    extended = true
    min = "0.116.0"
  [[module.imports]]
    path = "github.com/elecbrandy/freshpink"

[[menus.main]]
name = 'Home'
pageRef = '/'
weight = 10

[[menus.main]]
name = 'Gallery'
pageRef = '/gallery/'
weight = 20

[[menus.main]]
name = 'About'
pageRef = '/about/'
weight = 30


[params]
  # --- Site Metadata ---
  googleAnalytics = ""
  copyright = '© 2026 Kathy Wang. All rights reserved.'

  # --- Theme & Display Settings ---
  primaryColor = "#fa8b84"
  math = true

  # --- GitHub Chart ---
  githubUsername = "kathywang"
  showGithubChart = false

  # --- Main Image ---
  mainImageUrl = "/avatar.png"
  showMainImage = true

[taxonomies]
  tag = 'tags'

[markup]
  [markup.tableOfContents]
    endLevel = 3
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true