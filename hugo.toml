baseURL = 'https://kathywang.ca/'
languageCode = 'en-us'
title = 'Kathy Wang'
theme = 'hugo-theme-dream'
copyright = '© 2026 Kathy Wang. All rights reserved.'
pagination.pagerSize = 20  # Show all posts on one page

[params]
  # Author information
  author = 'Kathy Wang'
  description = 'Kathy Wang: Art & Photography'

  # Menu settings
  showMenu = false
  menuMore = false

  # Animation settings
  fadeIn = true

  # Code highlighting
  highlightJs = true

  # Theme customization
  defaultTheme = "auto"  # Options: "light", "dark", "auto"
  hideColorSchemeToggle = true  # Whether to hide the color scheme toggle button

  # Header settings
  headerTitle = 'kathy wang'  # Text to show in the header instead of the site title
  motto = 'kzw'  # Subtitle/motto to show under the title in the header

  # Footer settings
  footerBottomText = 'Artist | Lawyer | Investor'  # Additional text to show in the footer
  showArchive = true  # Whether to show the archive link in the footer
  showRss = true  # Whether to show the RSS link in the footer

  # Archive settings
  archiveGroupByDate = "2006-01"  # Format for grouping archive entries by date

  # For GitHub Pages deployment
  publishDir = 'docs'

  # zenMode = true
  
  lightTheme = "emerald"
  darkTheme = "forest"
  
