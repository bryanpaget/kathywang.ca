<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kathy Wang Photography</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        
        .container {
            max-width: 600px;
            padding: 20px;
        }
        
        h1 {
            font-size: 3rem;
            margin-bottom: 2rem;
            letter-spacing: 2px;
        }
        
        .enter-button {
            display: inline-block;
            padding: 15px 40px;
            font-size: 1.2rem;
            background-color: transparent;
            color: white;
            border: 2px solid white;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 1px;
        }
        
        .enter-button:hover {
            background-color: rgba(255, 255, 255, 0.1);
            transform: scale(1.05);
        }
        
        .footer {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            font-size: 0.9rem;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>KATHY WANG</h1>
        <a href="https://kathywang.tumblr.com/" class="enter-button">ENTER</a>
    </div>
    
    <div class="footer">
        © {{ now.Format "2006" }} Kathy Wang. All rights reserved.
    </div>
    
    <script>
        // Optional: Add smooth transition effect
        document.querySelector('.enter-button').addEventListener('click', function(e) {
            e.preventDefault();
            const link = this.getAttribute('href');
            
            // Add fade out effect
            document.body.style.opacity = 0;
            setTimeout(() => {
                window.location.href = link;
            }, 500);
        });
        
        // Fade in effect on page load
        document.body.style.opacity = 0;
        setTimeout(() => {
            document.body.style.transition = 'opacity 0.5s ease';
            document.body.style.opacity = 1;
        }, 100);
    </script>
</body>
</html>
