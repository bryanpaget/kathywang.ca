<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kathy Wang Photography</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background-color: #000;
            color: white;
            font-family: Arial, sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* Grid of images in the background */
        .image-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* Fewer columns on mobile */
            grid-template-rows: repeat(3, 1fr); /* Fewer rows on mobile */
            gap: 1px; /* Smaller gap on mobile */
            z-index: 1;
        }

        .grid-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.3;
        }

        /* Center content overlay - positioned in the middle */
        .center-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
            background-color: #000; /* Fully opaque black */
            padding: 40px 20px; /* Increased padding on mobile */
            border-radius: 0; /* Remove border radius for full edge-to-edge on mobile */
            text-align: center;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.1);
            width: 100%; /* Full width on mobile */
            height: auto; /* Auto height on mobile */
            max-width: calc(100vw - 20px); /* Account for some margin on mobile */
            max-height: calc(100vh - 20px); /* Account for some margin on mobile */
            display: flex;
            flex-direction: column;
            justify-content: space-around; /* Distribute space around elements */
            align-items: center; /* Center elements horizontally */
        }

        h1 {
            font-size: 2.2rem; /* Smaller font on mobile */
            margin: 0 0 1.5rem 0; /* Reset margins for better control */
            letter-spacing: 1.5px;
            color: white;
        }

        .enter-button {
            display: inline-block;
            padding: 12px 30px; /* Smaller padding on mobile */
            font-size: 1.1rem; /* Smaller font on mobile */
            background-color: transparent;
            color: white;
            border: 2px solid white;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 1px;
            margin: 0 auto 1.5rem auto; /* Add margin below button */
        }

        .enter-button:hover {
            background-color: rgba(255, 255, 255, 0.1);
            transform: scale(1.05);
        }

        .copyright {
            font-size: 0.8rem; /* Smaller font */
            opacity: 0.7;
            margin-top: 1rem; /* Space above copyright */
            align-self: center; /* Center the copyright text */
        }

        .footer {
            position: absolute;
            bottom: 15px; /* Smaller margin on mobile */
            width: 100%;
            text-align: center;
            font-size: 0.8rem; /* Smaller font on mobile */
            opacity: 0.7;
            z-index: 2;
        }

        /* Tablet screens */
        @media (min-width: 768px) {
            .image-grid {
                grid-template-columns: repeat(4, 1fr);
                grid-template-rows: repeat(4, 1fr);
                gap: 2px;
            }

            .center-content {
                padding: 50px 40px; /* Increased padding on tablet */
                width: 61.8vw; /* Golden ratio: ~61.8% of viewport width */
                height: 38.2vw; /* Golden ratio: ~38.2% of viewport width */
                max-width: 618px; /* Maintain golden ratio proportions */
                max-height: 382px; /* Maintain golden ratio proportions */
                min-width: 300px;
                border-radius: 0;
                display: flex;
                flex-direction: column;
                justify-content: space-around; /* Distribute space around elements */
                align-items: center; /* Center content horizontally */
            }

            h1 {
                font-size: 2.8rem;
                margin: 0 0 2.5rem 0; /* Increased bottom margin */
                letter-spacing: 2px;
            }

            .enter-button {
                padding: 15px 40px;
                font-size: 1.2rem;
                margin: 0 auto 2.5rem auto; /* Increased margin around button */
            }

            .copyright {
                font-size: 0.9rem;
                margin-top: 0; /* Remove extra top margin since using space-around */
            }

            .footer {
                bottom: 20px;
                font-size: 0.9rem;
            }
        }

        /* Desktop screens - golden ratio proportions */
        @media (min-width: 1024px) {
            .image-grid {
                grid-template-columns: repeat(6, 1fr);
                grid-template-rows: repeat(6, 1fr);
                gap: 2px;
            }

            .center-content {
                padding: 60px 50px; /* Increased padding on desktop */
                width: 61.8vw; /* Golden ratio: ~61.8% of viewport width */
                height: 38.2vw; /* Golden ratio: ~38.2% of viewport width */
                max-width: 800px; /* Maintain golden ratio proportions */
                max-height: 500px; /* Maintain golden ratio proportions */
                min-width: 300px;
                border-radius: 0;
                display: flex;
                flex-direction: column;
                justify-content: space-around; /* Distribute space around elements */
                align-items: center; /* Center content horizontally */
            }

            h1 {
                font-size: 3rem;
                margin: 0 0 3rem 0; /* Increased bottom margin */
            }

            .enter-button {
                padding: 15px 40px;
                font-size: 1.2rem;
                margin: 0 auto 3rem auto; /* Increased margin around button */
            }

            .copyright {
                font-size: 0.9rem;
                margin-top: 0; /* Remove extra top margin since using space-around */
            }
        }
    </style>

    <script>
        // Optional: Add smooth transition effect
        document.querySelector('.enter-button').addEventListener('click', function(e) {
            e.preventDefault();
            const link = this.getAttribute('href');

            // Add fade out effect
            document.body.style.opacity = 0;
            setTimeout(() => {
                window.location.href = link;
            }, 500);
        });

        // Fade in effect on page load
        document.body.style.opacity = 0;
        setTimeout(() => {
            document.body.style.transition = 'opacity 0.5s ease';
            document.body.style.opacity = 1;
        }, 100);
